name: CI

on: [push, pull_request]

jobs:
    test:
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # @see https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
                    # nb: ubuntu-20 images and earlier are not available anymore for github-hosted runners, as of 2026/6
                    # @todo run some tests on 'windows-latest' (needs test env setup scripts for windows to be developed)
                    -   php: '8.5' # native on ubuntu-26
                        operating-system: ubuntu-26.04
                        webserver: swoole
                    -   php: '8.4'
                        operating-system: ubuntu-24.04
                        webserver: nginx
                        code-coverage: true
                    -   php: '8.3' # native on ubuntu-24
                        operating-system: ubuntu-24.04
                        webserver: frankenphp
                    -   php: '8.2'
                        operating-system: ubuntu-22.04
                        # NB: the test suite is known to fail with the nginx version from ubuntu 22
                        webserver: apache

        steps:
            -    name: checkout code
                 uses: actions/checkout@v7

            # Although this action is quite nice, we prefer to use the same script to set up php that we use for the
            # docker image used for local testing. This allows us to make sure that script is always in good shape
            #-   name: set up php
            #    uses: shivammathur/setup-php@v2
            #    with:
            #        php-version: ${{ matrix.php }}
            #        extensions: curl, dom, mbstring, xsl
            #        ini-values: 'cgi.fix_pathinfo=1, always_populate_raw_post_data=-1'
            #        #tools: ${{ matrix.phpunit-version }}
            #        coverage: ${{ matrix.code-coverage}}

            -   name: set up env
                # @todo add env setup scripts for windows
                run: |
                    chmod 755 ./tests/env/setup/*.sh
                    sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/install_packages.sh
                    if [ '${{ matrix.webserver }}' = 'apache' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_apache.sh
                    fi
                    if [ '${{ matrix.webserver }}' = 'nginx' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_nginx.sh "${{ matrix.php }}"
                    fi
                    if [ '${{ matrix.webserver }}' = 'frankenphp' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_frankenphp.sh "$(echo "${{ matrix.php }}" | tr -d '.')"
                    fi
                    if [ '${{ matrix.webserver }}' = 'roadrunner' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_roadrunner.sh
                    fi

                    sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_php.sh ${{ matrix.php }}
                    sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_composer.sh

                    if [ '${{ matrix.webserver }}' = 'openswoole' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_pie_extensions.sh swoole/swoole
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_swoole.sh
                        sudo echo 'SWOOLE_EXTENSION=openswoole' >> /etc/default/swoole_server
                        sudo echo 'SWOOLE_EXTENSION=openswoole' >> /etc/default/swoole_waf
                    fi
                    if [ '${{ matrix.webserver }}' = 'swoole' ]; then
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_pie_extensions.sh swoole/swoole
                        sudo --preserve-env=GITHUB_ACTIONS ./tests/env/setup/setup_swoole.sh
                    fi

                    # fix fs perms for recent Apache versions configuration (ie. starting from Jammy)
                    f="$(pwd)"; while [[ $f != / ]]; do sudo chmod +rx "$f"; f="$(dirname "$f")"; done;
                    find . -type d -exec chmod +rx {} \;
                    find . -type f -exec chmod +r {} \;

                    if [ '${{ matrix.webserver }}' = 'apache' ]; then
                        sudo service apache2 start
                    elif [ '${{ matrix.webserver }}' = 'frankenphp' ]; then
                        sudo service php-fpm stop || true
                        # There is apparently an issue with the systemd FP config, so we use our own script...
                        sudo service '${{ matrix.webserver }}' stop || true
                        # @todo figure out why `frankenphp start` works but exits with code 1...
                        sudo ./tests/env/config/init.d/frankenphp start || true
                    #elif [ '${{ matrix.webserver }}' = 'roadrunner' ]; then
                    #    ...
                    elif [ '${{ matrix.webserver }}' = 'swoole' ] || [ '${{ matrix.webserver }}' = 'openswoole' ]; then
                        sudo service php-fpm stop || true
                        # we can not try to start swoole yet - we need to have composer deps set up first...
                    else
                        sudo service '${{ matrix.webserver }}' start
                    fi

            # Avoid downloading composer deps on every workflow run. Is this useful for us? Caching the installation of
            # php/apache/pie-built extensions would be more useful...
            #-
            #    uses: actions/cache@v2
            #    with:
            #        path: /tmp/composer-cache
            #        key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

            -   name: install dependencies
                run: |
                    composer install --no-interaction --no-progress --optimize-autoloader
                    if [ '${{ matrix.webserver }}' = 'openswoole' ]; then
                        composer require --no-interaction --no-progress --optimize-autoloader openswoole/core
                    fi

            -   name: start swoole
                if: ${{ matrix.webserver == 'swoole' || matrix.webserver == 'openswoole' }}
                run: |
                    sudo ./tests/env/config/init.d/swoole_server start
                    sudo ./tests/env/config/init.d/swoole_waf start

            -   name: run tests and upload coverage info if needed
                run: |
                    if [ -z "${{ matrix.code-coverage }}" ]; then
                        SERVER_TYPE='${{ matrix.webserver }}' ./vendor/bin/phpunit --log-junit ./test-results.xml tests
                    else
                        ./tests/env/setup/setup_code_coverage.sh enable
                        SERVER_TYPE='${{ matrix.webserver }}' ./vendor/bin/phpunit --log-junit ./test-results.xml --coverage-clover=coverage.clover tests
                        if [ ! -f coverage.clover ]; then
                            echo "WARNING: code coverage not generated. Is xdebug disabled?" >&2
                        fi
                    fi

            -   name: Upload test results reports to Codecov
                uses: codecov/codecov-action@v7
                if: ${{ !cancelled() }}
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    report_type: test_results
                    disable_search: true
                    files: ./test-results.xml

            -   name: Upload code coverage reports to Codecov
                uses: codecov/codecov-action@v7
                # @todo avoid running this for tests where coverage.clover was not generated
                if: ${{ matrix.code-coverage && !cancelled() }}
                with:
                    # @todo use env_vars to tag the upload with os/php-version/webserver
                    token: ${{ secrets.CODECOV_TOKEN }}
                    disable_search: true
                    files: coverage.clover

            -   name: downgrade dependencies
                run: 'composer update --prefer-lowest --no-interaction --no-progress'

            -   name: run tests again
                run: |
                    SERVER_TYPE='${{ matrix.webserver }}' ./vendor/bin/phpunit tests

            # disabled for the moment...
            #- name: Qodana scan
            #  uses: JetBrains/qodana-action@main
            #  env:
            #      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

            -   name: failure troubleshooting
                if: ${{ failure() }}
                run: |
                    if [ -f /var/log/apache2/error.log ]; then echo "Apache error log:" && sudo cat /var/log/apache2/error.log; fi
                    if [ -f /var/log/apache2/other_vhosts_access.log ]; then echo "Apache access log:" && sudo cat /var/log/apache2/other_vhosts_access.log; fi

                    if [ -f /var/log/nginx/error.log ]; then echo "Nginx error log:" && sudo cat /var/log/nginx/error.log; fi
                    if [ -f /var/log/nginx/access.log ]; then echo "Nginx access log:" &&  sudo cat /var/log/nginx/access.log; fi

                    if [ -f /var/log/frankenphp/frankenphp.log ]; then echo "FrankenPHP log:" && sudo cat /var/log/frankenphp/frankenphp.log; fi

                    #if [ -d /var/log/frankenphp/ ]; then sudo ls -la /var/log/frankenphp/; fi
                    #if [ -d /run/frankenphp/ ]; then sudo ls -la /run/frankenphp/; fi
                    #if [ -f /etc/frankenphp/Caddyfile ]; then echo "FrankenPHP config:" && sudo cat /etc/frankenphp/Caddyfile; fi

                    if [ -d /var/log/swoole/ ]; then sudo ls -la /var/log/swoole/; fi
                    if [ -d /run/swoole/ ]; then sudo ls -la /run/swoole/; fi
                    if [ -f /var/log/swoole/server.log ]; then echo "Swoole server log:" && sudo cat /var/log/swoole/server.log; fi
                    if [ -f /var/log/swoole/waf.log ]; then echo "Swoole waf log:" && sudo cat /var/log/swoole/waf.log; fi

                    echo "PHP logs:"
                    sudo cat /var/log/php*.log
