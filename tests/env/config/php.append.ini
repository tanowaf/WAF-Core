# Test-env specific configuration

# NB: only set up for web/fpm environments atm, not for php-cli
# NB: keep in sync with the settings in frankenphp+caddyfile

cgi.fix_pathinfo = 1

; make all errors visible - this will make tests fail which hit a php warning server-side
display_errors = 1
error_level = -1

; all test pages should return fairly quickly. Avoid tying up resources for a long time
max_execution_time = 15

; no output buffering allows testing slowloris responses
output_buffering = Off

; a few optimizations

opcache.enable = On
opcache.enable_cli = On
opcache.jit = tracing

; to be measured after running the test suite and some load tests
; (note that some of the values are in fact _smaller_ than the usual defaults - this is not an app with a huge codebase!)
;opcache.interned_strings_buffer = 8M
;opcache.jit_buffer_size = 24M
;opcache.max_accelerated_files = 500
;opcache.memory_consumption =24M
;realpath_cache_size = 512K

; extra settings only for prod (where php files are not supposed to change outside deployments)
;opcache.enable_file_override = 1
;opcache.huge_code_pages =
;opcache.validate_timestamps = 0
;realpath_cache_ttl = 600
