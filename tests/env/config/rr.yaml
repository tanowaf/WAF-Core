version: '3'

server:
    # @todo... figure out this part
    command: 'php app.php'
    relay: pipes

http:
    address: '0.0.0.0:8088'
    middleware:
        - gzip
        - static
    static:
        dir: /home/docker/workspace/tests/public
        forbid:
            - .php
            - .htaccess
    pool:
        num_workers: 1
        supervisor:
            max_worker_memory: 100

