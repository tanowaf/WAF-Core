version: '3'

server:
    command: 'php /var/www/tests/public/waf.php'
    relay: pipes
    env:
        ROADRUNNER_WORKER: 1

# @todo configure the pool with the same number of workers as the other servers
http:
    address: '0.0.0.0:8083'
#    middleware:
